{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/level1_registration.css' %}">
<div class="glass-morphism-container1" id="payment-card">
  <h1 class="form-heading"><span class="l1-eyebrow">IKF Scout • Level 1</span><br>{{ heading_payment|default:"Secure payment" }}</h1>
  <div class="row">
    <div class="col-lg-12 mt-3">
      <div class="form-group">
        <label>{{ payment_amount_label|default:"Payment amount" }}</label>
        <input class="form-control" id="payment_amount" type="text" readonly>
      </div>
    </div>
    <div class="text-center col-lg-12 mt-3">
      <p id="payment-message" role="status" aria-live="polite"></p>
      <button id="rzp-button1" type="button">Pay securely</button>
      <button id="reconcile-button" type="button" hidden>Check payment status</button>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(() => {
  const verifyUrl = "{% url 'paymentstatus' %}";
  const reconcileUrl = "{% url 'reconcile_scout_payment' %}";
  const csrfToken = "{{ csrf_token }}";
  const keyId = "{{ razorpay_key_id|escapejs }}";
  const ikfId = sessionStorage.getItem("ikfuniqueid") || "";
  const orderId = sessionStorage.getItem("order_id") || "";
  const storedAmount = sessionStorage.getItem("DISCOUNTEDAMOUNT") || "";
  let customer = {};
  try { customer = JSON.parse(sessionStorage.getItem("data") || "{}"); } catch (_) {}

  const payButton = document.getElementById("rzp-button1");
  const reconcileButton = document.getElementById("reconcile-button");
  const message = document.getElementById("payment-message");
  document.getElementById("payment_amount").value = storedAmount ? `₹${storedAmount}` : "Calculated securely";

  function show(text, uncertain = false) {
    message.textContent = text;
    reconcileButton.hidden = !uncertain;
  }

  async function post(url, values) {
    const body = new URLSearchParams({...values, csrfmiddlewaretoken: csrfToken});
    const response = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"},
      body,
      credentials: "same-origin",
    });
    let result = {};
    try { result = await response.json(); } catch (_) {}
    if (!response.ok || result.error) throw new Error(result.message || "Unable to verify payment.");
    return result;
  }

  async function verify(response) {
    payButton.disabled = true;
    show("Verifying your captured payment with Razorpay…");
    try {
      await post(verifyUrl, {
        ikfuniqueid: ikfId,
        status: "success",
        razorpay_order_id: response.razorpay_order_id || "",
        razorpay_payment_id: response.razorpay_payment_id || "",
        razorpay_signature: response.razorpay_signature || "",
      });
      show("Payment verified. Your registration is confirmed.");
      window.location.href = "{% url 'printpdf' %}";
    } catch (error) {
      show(`${error.message} If money was deducted, use “Check payment status”; do not pay again.`, true);
      payButton.disabled = false;
    }
  }

  async function reconcile() {
    reconcileButton.disabled = true;
    show("Checking the payment directly with Razorpay…", true);
    try {
      const result = await post(reconcileUrl, {ikfuniqueid: ikfId, order_id: orderId});
      if (result.paid) {
        show("Payment verified. Your registration is confirmed.");
        window.location.href = "{% url 'printpdf' %}";
      } else {
        show(result.message || "No captured payment was found. You may retry payment.", true);
      }
    } catch (error) {
      show(error.message, true);
    } finally {
      reconcileButton.disabled = false;
    }
  }

  if (!keyId || !ikfId || !orderId) {
    payButton.disabled = true;
    show("This payment session is incomplete. Please return to registration and try again.");
    return;
  }

  const checkout = new Razorpay({
    key: keyId,
    currency: "INR",
    name: "India Khelo Football",
    description: "Scout registration",
    order_id: orderId,
    handler: verify,
    prefill: {
      name: `${customer.first_name || ""} ${customer.last_name || ""}`.trim(),
      email: customer.email || "",
      contact: customer.mobile || "",
    },
    notes: {ikfuniqueid: ikfId},
    theme: {color: "#3399cc"},
    modal: {ondismiss: () => show("Payment window closed. You can safely retry.")},
  });

  checkout.on("payment.failed", async response => {
    const error = response.error || {};
    const metadata = error.metadata || {};
    try {
      await post(verifyUrl, {
        ikfuniqueid: ikfId,
        status: "failed",
        error_code: error.code || "",
        error_description: error.description || "Payment failed",
        error_source: error.step || "",
        error_reason: error.reason || "",
        error_meta_order_id: metadata.order_id || orderId,
        error_meta_payment_id: metadata.payment_id || "",
      });
    } catch (_) {}
    show(`${error.description || "Payment was not completed."} If money was deducted, check payment status.`, true);
  });

  payButton.addEventListener("click", () => checkout.open());
  reconcileButton.addEventListener("click", reconcile);
})();
</script>
{% endblock %}
