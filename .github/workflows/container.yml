name: Build and publish container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scout
          MYSQL_ROOT_PASSWORD: scout-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pscout-ci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scout-site" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scout-site:test
      - name: Check Python dependencies
        run: docker run --rm scout-site:test python -m pip check
      - name: Compile Python sources
        run: docker run --rm scout-site:test python -m compileall -q manage.py scoutikf registration dashboard login coachlogin teams
      - name: Run Django system checks
        run: >-
          docker run --rm --network host
          -e DJANGO_DEBUG=true -e DB_NAME=scout -e DB_USER=root
          -e DB_PASSWORD=scout-ci-root -e DB_HOST=127.0.0.1 -e DB_PORT=3306
          scout-site:test python manage.py check --database default
      - name: Check migration drift
        run: >-
          docker run --rm --network host
          -e DJANGO_DEBUG=true -e DB_NAME=scout -e DB_USER=root
          -e DB_PASSWORD=scout-ci-root -e DB_HOST=127.0.0.1 -e DB_PORT=3306
          scout-site:test python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: >-
          docker run --rm --network host
          -e DJANGO_DEBUG=true -e DB_NAME=scout -e DB_USER=root
          -e DB_PASSWORD=scout-ci-root -e DB_HOST=127.0.0.1 -e DB_PORT=3306
          scout-site:test python manage.py test
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
